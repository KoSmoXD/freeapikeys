name: Android Geode build

on:
  workflow_dispatch:
  push:
    branches: [trajectory-autoplayer-android]
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'CMakeLists.txt'
      - 'mod.json'
      - 'src/**'

jobs:
  android:
    name: Geode ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android64, Android32]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Ninja is executable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build
          command -v ninja
          ninja --version
      - name: Build with official Geode SDK action
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          android-ndk-version: '28.2.13676358'
          use-lto: 'false'
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-autoplayer-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
