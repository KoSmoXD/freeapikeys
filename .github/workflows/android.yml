name: Android Geode build
on:
  workflow_dispatch:
  push:
    branches: [main, trajectory-autoplayer-android]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: Use runner preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" 
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
      - name: Install NDK r28 (Clang 19+)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Fetch Geode SDK
        run: git clone --recursive --branch v5.5.3 https://github.com/geode-sdk/geode.git "$RUNNER_TEMP/geode-sdk"
      - name: Configure
        env:
          GEODE_SDK: ${{ runner.temp }}/geode-sdk
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-23
      - name: Compile and package
        run: cmake --build build --config Release
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: |
            build/**/*.geode
            build/**/*.so
          if-no-files-found: warn
